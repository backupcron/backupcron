name: macOS release

on:
  push:
    branches: [main]
    paths: ['Resources/Info.plist']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read release version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Run tests
        run: swift test
      - name: Build Apple Silicon and Intel binaries
        shell: bash
        run: |
          for architecture in arm64 x86_64; do
            swift build --product BackupCron --configuration release \
              --triple "$architecture-apple-macosx14.0" \
              --scratch-path "$RUNNER_TEMP/backupcron-$architecture"
          done
          arm_bin=$(swift build --configuration release --triple arm64-apple-macosx14.0 --scratch-path "$RUNNER_TEMP/backupcron-arm64" --show-bin-path)
          intel_bin=$(swift build --configuration release --triple x86_64-apple-macosx14.0 --scratch-path "$RUNNER_TEMP/backupcron-x86_64" --show-bin-path)
          app="$RUNNER_TEMP/BackupCron.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" .build
          lipo -create "$arm_bin/BackupCron" "$intel_bin/BackupCron" -output "$app/Contents/MacOS/BackupCron"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          cp Resources/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cp -R Sources/BackupFlow/Resources/*.lproj "$app/Contents/Resources/"
          xattr -cr "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/BackupCron" -verify_arch arm64 x86_64
      - name: Package and verify the installer
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/backupcron-dmg-tools"
          "$RUNNER_TEMP/backupcron-dmg-tools/bin/python" -m pip install dmgbuild==1.6.7
          export DMGBUILD_BIN="$RUNNER_TEMP/backupcron-dmg-tools/bin/dmgbuild"
          zsh scripts/build-dmg.sh "$RUNNER_TEMP/BackupCron.app" ".build/BackupCron-$RELEASE_VERSION-universal-installer.dmg"
          mkdir -p "$RUNNER_TEMP/backupcron-dmg-check"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/backupcron-dmg-check" ".build/BackupCron-$RELEASE_VERSION-universal-installer.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/backupcron-dmg-check"' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/backupcron-dmg-check/BackupCron.app"
          lipo "$RUNNER_TEMP/backupcron-dmg-check/BackupCron.app/Contents/MacOS/BackupCron" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/backupcron-dmg-check/BackupCron.app/Contents/Info.plist")" = "$RELEASE_VERSION"
          cd .build
          shasum -a 256 "BackupCron-$RELEASE_VERSION-universal-installer.dmg" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: BackupCron-macOS-release
          path: |
            .build/*universal-installer.dmg
            .build/SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## External disks, cold storage and remote folders

          - Cold storage for verified copies of successful backups on selected external disks.
          - External disk detection and copying on connection, including support for renamed disks.
          - Continuous folder copying with incremental checkpoints, retries and cancellation; older destination files are preserved.
          - Remote folder backups over SSH using rsync, as separate copies or ZIP archives.
          - An expanded menu bar panel with job controls, progress, cold storage status and activity animation.
          - Settings backup and restore now include cold storage configuration.
          - Updated interface translations in all ten supported languages.

          Restoring pauses the scheduler. Check paths, access permissions and passwords before enabling it. Passwords, file-access permissions, history and system startup registration are not transferred. iCloud Drive manages uploading the saved files.

          Download the universal DMG for Apple Silicon or Intel, open it and drag BackupCron into Applications. Requires macOS 14 or later.

          This build is ad hoc signed and is not notarized by Apple. Verify the SHA-256 checksum before installation. If macOS blocks the verified download, review it in System Settings → Privacy & Security.

          Verification: automated tests, both CPU architectures, installer image integrity and strict app signature verification after mounting the DMG. Tests cover temporary local files and simulated disk and SSH behavior; physical disk reconnection, live SSH servers, iCloud upload completion and startup after an OS login are not exercised by CI. Database integration tests require opt-in disposable fixtures.
          NOTES
          printf '\nBuilt from `%s`.\n\nSHA-256:\n```text\n' "$SOURCE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"
          cat .build/SHA256SUMS.txt >> "$RUNNER_TEMP/release-notes.md"
          printf '\n```\n' >> "$RUNNER_TEMP/release-notes.md"
          gh release create "v$RELEASE_VERSION" --repo "$GH_REPO" --target "$SOURCE_COMMIT" \
            --title "BackupCron $RELEASE_VERSION for macOS" --notes-file "$RUNNER_TEMP/release-notes.md" \
            ".build/BackupCron-$RELEASE_VERSION-universal-installer.dmg" .build/SHA256SUMS.txt
